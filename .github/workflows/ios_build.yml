name: Build iOS IPA

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14  # Apple Silicon M1 - free for public repos
    name: Build iOS IPA
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FVM
        run: dart pub global activate fvm
        
      - name: Add Dart to PATH
        run: echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Cache FVM Flutter
        uses: actions/cache@v4
        with:
          path: ~/.fvm/versions
          key: fvm-macos-3.22.3
          restore-keys: fvm-macos-

      - name: Install Flutter via FVM
        run: fvm install 3.22.3

      - name: Get Flutter dependencies
        run: fvm flutter pub get

      - name: Run code generation (build_runner)
        run: fvm flutter pub run build_runner build --delete-conflicting-outputs

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS (no codesign - for AltStore/SideStore sideloading)
        run: fvm flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r ../Runner.ipa Payload
          echo "IPA created at build/ios/Runner.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ github.sha }}
          path: build/ios/Runner.ipa
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/ios/Runner.ipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
