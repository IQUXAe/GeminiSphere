name: Build iOS IPA

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14  # Apple Silicon M1 - free for public repos
    name: Build iOS IPA
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run code generation (build_runner)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS (no codesign - for AltStore/SideStore sideloading)
        run: flutter build ios --release --no-codesign

      - name: Package and Fakesign IPA for AppSync
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          
          # Create Entitlements for fake signing
          cat <<EOF > Entitlements.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>application-identifier</key>
              <string>org.iquxae.geminisphere</string>
              <key>get-task-allow</key>
              <true/>
          </dict>
          </plist>
          EOF
          
          # Fakesign frameworks without entitlements
          find build/ios/ipa/Payload/Runner.app/Frameworks -type d -name "*.framework" -exec codesign -s - --force {} \;
          
          # Fakesign the app payload with entitlements
          codesign -s - --entitlements Entitlements.plist --force build/ios/ipa/Payload/Runner.app
          
          cd build/ios/ipa
          zip -r ../Runner.ipa Payload
          echo "IPA created and fakesigned at build/ios/Runner.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ github.sha }}
          path: build/ios/Runner.ipa
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/ios/Runner.ipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
